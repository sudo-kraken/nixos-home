---
name: Lint Nix Config

on:
  - push
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
      - name: Run flake check
        run: nix flake check --no-update-lock-file --print-build-logs
      - name: Evaluate NixOS hosts
        run: |
          nix eval --raw --no-update-lock-file .#nixosConfigurations.desktop.config.system.build.toplevel.drvPath
          nix eval --raw --no-update-lock-file .#nixosConfigurations.wsl.config.system.build.toplevel.drvPath
      - name: Verify clean checkout
        run: git diff --exit-code
